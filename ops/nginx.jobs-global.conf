# Jobs only. Install only after TLS issuance and application/cutover gates.
# Do NOT replace a wildcard/parent Portal ERP server block with this file.
# Exact hosts only: editorial portalerp.com and its regional sites are untouched.
server {
    listen 443 ssl;
    server_name jobs.portalerp.com;
    ssl_certificate /etc/letsencrypt/live/jobs.portalerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.portalerp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/portal-erp-jobs/frontend/dist;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    client_max_body_size 10m;

    # Direct regional API requests keep method/body/query. Context is derived
    # from the external path and overwritten on a loopback-only upstream.
    location ~ "^/(?<jobs_country>[a-z]{2})/api(?<jobs_api_path>/.*)?$" {
        set $jobs_prefix /$jobs_country;
        set $jobs_upstream_path $jobs_api_path;
        if ($jobs_upstream_path = "") { set $jobs_upstream_path /; }
        # Flask collections require '/'; normalize internally rather than
        # exposing a 308 with the private Host and losing the regional path.
        if ($jobs_api_path ~ "^/(jobs|companies|applications)$") {
            set $jobs_upstream_path $jobs_api_path/;
        }
        proxy_pass http://127.0.0.1:5000/api$jobs_upstream_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5000;
        proxy_set_header X-Regional-Host $host;
        proxy_set_header X-Regional-Prefix $jobs_prefix;
        proxy_set_header X-Site-Id "";
        proxy_set_header X-Site-Key "";
        proxy_set_header X-Regional-Site "";
        proxy_set_header X-Next-Regional-Country "";
        proxy_set_header X-Next-Regional-Prefix "";
        proxy_set_header X-Next-Regional-Path "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
    }

    # No implicit unprefixed region on the global host. Root Admin calls /br/api.
    location = /api { return 404; }
    location /api/ { return 404; }
    location /bff/ { return 404; }

    # Keep the Admin root and visual CV shell in the existing SPA. These are
    # explicit locations, not a catch-all that could make inactive markets 200.
    location = /admin {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /admin/ {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location = /br/candidato/curriculo {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location = /br/candidato/curriculo/ {
        return 308 /br/candidato/curriculo;
    }
    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets and all regional pages/BFFs go through Next.
    # Do not regex-cache tokenized URLs or rewrite them to a SPA fallback.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Regional-Host "";
        proxy_set_header X-Regional-Prefix "";
        proxy_set_header X-Site-Id "";
        proxy_set_header X-Site-Key "";
        proxy_set_header X-Regional-Site "";
        proxy_set_header X-Next-Regional-Country "";
        proxy_set_header X-Next-Regional-Prefix "";
        proxy_set_header X-Next-Regional-Path "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name jobs.portalerp.com.br;
    ssl_certificate /etc/letsencrypt/live/jobs.portalerp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.portalerp.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Preserve the registered legacy API alias for old direct API clients.
    # Never use a blanket 301 on POST, body-bearing API or auth requests.
    location /api/ {
        rewrite ^/api/(jobs|companies|applications)$ /api/$1/ break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5000;
        proxy_set_header X-Regional-Host jobs.portalerp.com.br;
        proxy_set_header X-Regional-Prefix "";
        proxy_set_header X-Site-Id "";
        proxy_set_header X-Site-Key "";
        proxy_set_header X-Regional-Site "";
        proxy_set_header X-Next-Regional-Country "";
        proxy_set_header X-Next-Regional-Prefix "";
        proxy_set_header X-Next-Regional-Path "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
    }
    location = /api { return 404; }
    location /bff/ {
        # An old opened session must reload the new login. Do not forward
        # cookies/tokens across hosts or replay old mutating BFF requests.
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        return 409;
    }
    # JOBS_FRIENDLY_URLS_LEGACY_NUMERIC_BEGIN
    # Pre-launch URL replacement: obsolete numeric job paths are not redirected.
    location ~ ^/(?:br/)?vagas/[0-9]+/?$ {
        return 404;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
    }
    # JOBS_FRIENDLY_URLS_LEGACY_NUMERIC_END

    location = /robots.txt { return 301 https://jobs.portalerp.com/robots.txt; }
    location = /sitemap.xml { return 301 https://jobs.portalerp.com/br/sitemap.xml; }
    location = /og-image.png { return 301 https://jobs.portalerp.com/og-image.png; }
    location = /og-image.svg { return 301 https://jobs.portalerp.com/og-image.svg; }
    location ~ ^/(assets|brand|uploads|_next)/ { return 301 https://jobs.portalerp.com$request_uri; }
    location = /admin { return 301 https://jobs.portalerp.com/admin; }
    location /admin/ { return 301 https://jobs.portalerp.com$request_uri; }
    location = / { return 301 https://jobs.portalerp.com/br; }
    # Prevent double-prefixing old links already containing /br.
    location /br/ { return 301 https://jobs.portalerp.com$request_uri; }
    location = /br { return 301 https://jobs.portalerp.com/br; }
    location / {
        # Only navigational GET/HEAD is migrated with a permanent redirect.
        if ($request_method !~ ^(GET|HEAD)$) { return 409; }
        return 301 https://jobs.portalerp.com/br$request_uri;
    }
}

server {
    listen 80;
    server_name jobs.portalerp.com jobs.portalerp.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal-erp-jobs/acme;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
